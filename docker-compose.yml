services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cannjudge_watcher}
      POSTGRES_USER: ${POSTGRES_USER:-cannjudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cannjudge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      target: backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cannjudge_watcher}
      DB_USERNAME: ${POSTGRES_USER:-cannjudge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cannjudge}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DEFAULT_POLL_INTERVAL_SECONDS: ${DEFAULT_POLL_INTERVAL_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "${PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
